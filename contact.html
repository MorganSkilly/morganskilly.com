<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Morgan Skillicorn Virtual Production Technical Artist" />
        <meta name="author" content="Morgan Skillicorn" />
        <meta name="fediverse:creator" content="@MorganSkilly@mastodon.gamedev.place">

        <title>Morgan Skillicorn - Contact</title>
        
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        
        <link rel="stylesheet" href="css/hover.css">
        <link href="css/styles.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <script src="https://kit.fontawesome.com/66afee0429.js" crossorigin="anonymous"></script>

        <style>
            .contact-layout {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2rem;
            }

            .profile-image-wrap {
                display: flex;
                justify-content: center;
                flex-shrink: 0;
            }

            .profile-image-wrap img {
                width: 220px;
                height: 220px;
                object-fit: cover;
                border-radius: 50%;
                display: block;
                border: 3px solid rgba(255, 255, 255, 0.3);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
            }

            .contact-copy {
                flex: 1;
                min-width: 0;
            }

            .contact-copy p {
                text-align: left;
            }

            @media (max-width: 767.98px) {
                .contact-layout {
                    flex-direction: column;
                    text-align: center;
                }

                .contact-copy p {
                    text-align: center;
                }
            }
        </style>

    </head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T45FLM3SND"></script>

    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-T45FLM3SND');
    </script>

    <body>
        <!-- Responsive navbar-->        
        <div id="navbar-container"></div>
        
        <!-- Header - set the background image for the header in the line below-->
        <header class="py-5 bg-image-full" style="background-image: url('assets/bannerrr.jpg'); background-size: cover; background-position: left; height: 40rem;">
            <div class="container h-100 d-flex justify-content-center align-items-center"></div>
        </header>

        <!-- Content section-->
        <section class="py-5">
            <div class="container my-5">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="contact-layout">
                            <div class="profile-image-wrap">
                                <img src="assets/profileicon.jpg" alt="Morgan Skillicorn profile picture" />
                            </div>
                            <div class="contact-copy">
                                <p class="m-0 lead">
                                    Please reach out to me on LinkedIn. I'm actively looking for a new opportunities!
                                </p>
                                <p class="m-0 lead">
                                    Email me: <a href="mailto:hello@morgan.games">hello@morgan.games</a>
                                </p>
                                <br>
                                <div id="socials-container"></div>
                                <br>
                            </div>
                        </div>
                        <br>
                    </div>                 
                </div>            
        </section>

        <!-- Footer-->
        <footer class="py-5 bg-dark">            
            <div id="footer-container"></div>
        </footer>
        
        <script src="loadHTML.js"></script>

        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
    </body>
</html>
